<!--
  HOW TO USE
  1. Copy this file to <slug>.html (e.g. dairy-bread-eggs.html). Slug must match js/categories.js.
  2. Edit ONLY the SECTION block below.
  3. Put images in images/<slug>/<slug>-01.avif, -02, ... (same order as products; png/jpg/jpeg/webp/svg also work).
     Missing image = letter placeholder.
-->
<script>
